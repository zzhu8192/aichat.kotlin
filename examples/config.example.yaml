# Groovy tools you write yourself, evaluated from <config dir>/tools/*.groovy
# at startup. No build step, no jar and no compiler wait: the file runs in the
# same session groovy_eval uses, so it gets the same classpath LLM-authored
# code gets.
#
# The contract is one sentence: the file's last expression must be a
# kotllm.tools.Tool. The constructor is
# (name, description, parameters, preview, run, readOnly):
#
#   def schema = Tool.schema('''{ "type": "object", ... }''')
#
#   new Tool("word_count", "Counts words in `text`; unique=true counts " +
#       "distinct.", schema,
#       { args -> "count words" },       // preview, shown at the confirm prompt
#       { args -> new ToolResult(...) },
#       true)                            // readOnly: skips the confirm prompt
#
# Two interop rules, both of which fail at load rather than at edit time:
# use `Tool.schema(text)` rather than kotlinx's `Json` (Groovy cannot reach its
# companion), and use `Tool.optStr`/`optBool` rather than `Tool.str(...).fold`
# (Outcome's combinators are Kotlin extension functions, invisible to Groovy).
#
# You write the JSON Schema yourself. Nothing is derived by reflection, which
# means nothing can be derived wrongly: what you write is exactly what the
# model is shown. Name the arguments in `description` too -- it is the only
# prose the model gets. See examples/tools/word_count.groovy.
#
# Each file is evaluated separately, so one that fails is reported and skipped
# rather than taking the others with it.
#
# /tools lists what each file produced, /tools reload re-evaluates them.
# user_tools: true

# ---------------------------------------------------------------------------
# Tool families that are off by default, purely on cost
# ---------------------------------------------------------------------------
#
# Tool schemas are not part of the system prompt -- they are a sibling field of
# `messages` on the request -- but the provider serialises them into the
# model's context and bills them as input all the same. On a default config
# they were 4,752 tokens against 670 for the prompt: seven times larger, and
# invisible from inside the REPL until `/prompt full` learnt to weigh them.
#
# So the families below are opt-in. Nothing about them is broken and none is
# deprecated; each is simply dead weight on the many turns that are a question
# rather than a task. `docs/tools.md` is right that a tool the model is not
# told about does not get used -- that is the price you are choosing to pay,
# and it is why the file family, the interpreters and `exec` stay on.
#
# Turn one back on and it behaves exactly as it always did.

# create_tasks + update_task: the visible checklist.  ~362 tokens
# task_tools: false

# add_or_update_memory + delete_memory + read_memory.  ~266 tokens
# You can still write memories yourself with /memory, which costs nothing
# per request; this key is only about the model writing them.
# memory_tools: false

# web_search + fetch.  ~390 tokens
# web_tools: false

# session_transfer: move a value straight from one interpreter session to
# another. Needs two sessions to be useful at all.  ~219 tokens
# session_transfer: false

# java_eval, plus `java` in every `language` enum.  ~249 tokens
# Off by default since 1.33.0. Not a judgement on JShell -- it is the only
# session here that can hard-stop `while (true) {}` -- but a Groovy-first tool
# offering three interpreters charges everyone for what few use.
# java_eval: false

# ---------------------------------------------------------------------------
# How much of a tool call reaches the screen
# ---------------------------------------------------------------------------
#
# Display only. The model receives the whole preview and the whole result
# either way, so these cost no tokens -- they decide whether a conversation
# stays readable when a tool reads a file.
#
# They were hardcoded at 12 and 16 from the first tool harness, which buries
# the transcript the moment anything calls read_to_context. Both are settable
# mid-session with /set, which is when you actually discover a result was
# worth seeing in full. 0 hides that part entirely.

# tool_preview_lines: 3    # the arguments, shown before the call runs
# tool_output_lines: 6     # what came back
